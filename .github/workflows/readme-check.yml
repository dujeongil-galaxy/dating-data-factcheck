name: 站点检查

on:
  push:
    paths:
      - "README.md"
      - "*.html"
      - ".github/scripts/**"
      - ".github/workflows/readme-check.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一次，链接失效能及时发现（UTC 周一 01:00）
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 README（占位符、表格列数、外链）
        run: python .github/scripts/check_readme.py README.md

      - name: 检查 HTML 页面（结构、导航一致、内外链、零外部依赖、窄屏溢出）
        run: python .github/scripts/check_site.py
