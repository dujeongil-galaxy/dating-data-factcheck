name: 站点检查

on:
  push:
    paths:
      - "README.md"
      - "*.html"
      - "*.js"
      - "en/**/*.html"
      - "jp/**/*.html"
      - "ko/**/*.html"
      - "scripts/i18n-data.tsv"
      - "scripts/i18n_build.py"
      - "scripts/i18n_verify.py"
      - ".github/scripts/**"
      - ".github/workflows/readme-check.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一次，链接失效能及时发现（UTC 周一 01:00）
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 README（占位符、表格列数、外链）
        run: python .github/scripts/check_readme.py README.md

      - name: 检查 HTML 页面（结构、导航一致、内外链、零外部依赖、窄屏溢出）
        run: python .github/scripts/check_site.py

      - name: 检查新站公告弹窗（5 秒锁定 / 仅 × 可关 / 故障注入自检）
        run: python .github/scripts/check_promo_modal.py

      - name: 检查中英日韩四语（字典 / 18 张生成页 / 语言菜单 / 故障注入自检）
        run: python scripts/i18n_verify.py

      - name: 构建产物必须与中文源页同步（禁止手改 en/jp/ko）
        run: |
          python scripts/i18n_build.py
          git diff --exit-code -- en jp ko
